<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Web App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <a href="#" class="logo-link">
            <img src="images/NewTownLogo.png" alt="NewTown Logo" class="logo">
        </a>
    </nav>
    <div class="hero-banner">
        <div class="hero-text">NewTown</div>
        <div class="arrow-down"></div>
    </div>
    <div class="tshirt-grid">
        <div class="tshirt-modal">
            <img src="images/TShirtSketch.jpg" alt="T-Shirt 1">
        </div>
        <div class="tshirt-modal">
            <img src="images/TShirtSimpleBlue.jpg" alt="T-Shirt 2">
        </div>
        <div class="tshirt-modal">
            <img src="images/NewtownRacetrackBlack.jpg" alt="T-Shirt 3">
        </div>
        <div class="tshirt-modal">
            <img src="images/TShirtNewtownClassicBlue.jpg" alt="T-Shirt 4">
        </div>
    </div>
</body>
</html>
